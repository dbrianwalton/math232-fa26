<article class="theorem theorem-like"><h2 class="heading">
<span class="type">Theorem</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">88</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="title">Sine Is Odd and Cosine Is Even.</span>
</h2>
<div class="para logical">
<div class="para">For every angle <span class="process-math">\(\theta\text{,}\)</span>
</div>
<div class="displaymath process-math">
\begin{align*}
\sin(-\theta) \amp = -\sin(\theta) \\
\cos(-\theta) \amp = \cos(\theta)\text{.} 
\end{align*}
</div>
<div class="para">That is, <span class="process-math">\(\sin\)</span> is an odd function and <span class="process-math">\(\cos\)</span> is an even function.</div>
