<article class="theorem theorem-like"><h2 class="heading">
<span class="type">Theorem</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">75</span><span class="period heading-divison-mark heading-divison-mark__period">.</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="title">The Fundamental Theorem of Calculus (Part 2).</span>
</h2>
<div class="para logical">
<div class="para">If <span class="process-math">\(F(x)\)</span> is <em class="emphasis">any</em> antiderivative of <span class="process-math">\(f(x)\)</span> and <span class="process-math">\(f(x)\)</span> is continuous between <span class="process-math">\(a\)</span> and <span class="process-math">\(b\text{,}\)</span> then</div>
<div class="displaymath process-math">
\begin{equation*}
\int_a^b f(x)\,dx = F(b)-F(a)\text{.}
\end{equation*}
</div>
